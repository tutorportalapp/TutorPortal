<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>Log in | TutorPortal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap masthead">
    <div class="mast-left">
      <p class="eyebrow">New South Wales · Mathematics Advanced</p>
      <a class="brand" href="index.html">TutorPortal</a>
    </div>
    <div class="mast-right">
      <p class="stats-line" id="mastStats"></p>
      <div class="toolbar">
        <a class="btn" href="library.html?focus=1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg> Search</a>
        <span id="authSlot"><a class="btn primary" href="login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Sign In</a></span>
      </div>
    </div>
  </div>
  <div class="nav-wrap"><div class="wrap"><nav class="nav">
      <a href="index.html">Home</a>
      <a href="library.html">Library</a>
      <a href="builder.html">Builder</a>
      <a href="history.html">History</a>
  </nav></div></div>
</header>

<main class="wrap" style="max-width:520px;padding-top:36px;padding-bottom:64px">
  <div class="panel">
    <h2 id="heading">Welcome back</h2>
    <p class="hint">Log in to save your papers and see your history.</p>

    <form id="form" novalidate>
      <div id="nameRow" hidden style="margin-bottom:14px">
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="name">
      </div>
      <div style="margin-bottom:14px">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email">
      </div>
      <div style="margin-bottom:18px">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>
      <button class="btn primary" style="width:100%" id="submit" type="submit">Log in</button>
      <button class="btn" style="width:100%;margin-top:10px" type="button" id="google">Continue with Google</button>
    </form>

    <p class="msg" id="msg" role="status" style="margin-top:16px"></p>
    <p class="msg"><a href="#" id="toggle">New here? Create a profile</a></p>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const next = new URLSearchParams(location.search).get('next') || 'builder.html';
  const dest = /^[\w-]+\.html$/.test(next) ? next : 'builder.html';
  let signup = false;
  const say = (t) => { $('msg').textContent = t; };

  if (!TP.configured) {
    say(TP.demo
      ? 'Sign-in is not connected yet (add your Supabase keys in js/config.js). Local preview: you can open the builder directly.'
      : 'Sign-in is not available yet. Please check back soon.');
    if (TP.demo) { const a = document.createElement('a'); a.href = dest; a.textContent = 'Open builder (local preview)'; $('msg').after(a); }
  }
  TP.session().then((s) => { if (s) location.replace(dest); }).catch(() => {});

  $('toggle').addEventListener('click', (e) => {
    e.preventDefault();
    signup = !signup;
    $('heading').textContent = signup ? 'Create your profile' : 'Welcome back';
    $('submit').textContent = signup ? 'Create profile' : 'Log in';
    $('nameRow').hidden = !signup;
    $('toggle').textContent = signup ? 'Already have a profile? Log in' : 'New here? Create a profile';
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    say('');
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!TP.configured) return;
    const email = $('email').value.trim(), password = $('password').value;
    if (!email || password.length < 6) return say('Enter your email and a password of at least 6 characters.');
    $('submit').disabled = true; say('Please wait...');
    try {
      const c = await TP.client();
      if (signup) {
        const { data, error } = await c.auth.signUp({ email, password, options: { data: { display_name: $('name').value.trim() } } });
        if (error) throw error;
        if (!data.session) { say('Check your email to confirm your address, then log in.'); return; }
      } else {
        const { error } = await c.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
      location.replace(dest);
    } catch (err) { say(err.message || 'Something went wrong.'); }
    finally { $('submit').disabled = false; }
  });

  $('google').addEventListener('click', async () => {
    if (!TP.configured) return say('Sign-in is not connected yet.');
    const c = await TP.client();
    const { error } = await c.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: new URL(dest, location.href).href } });
    if (error) say(error.message);
  });
</script>
</body>
</html>

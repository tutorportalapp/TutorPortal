<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>Library | TutorPortal</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/ui.js"></script>
</head>
<body>
<header class="site-header">
  <div class="wrap masthead">
    <div class="mast-left">
      <p class="eyebrow">New South Wales · Mathematics Advanced</p>
      <a class="brand" href="index.html">TutorPortal</a>
    </div>
    <div class="mast-right">
      <p class="stats-line" id="mastStats"></p>
      <div class="toolbar">
        <a class="btn" href="library.html?focus=1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg> Search</a>
        <span id="authSlot"><a class="btn primary" href="login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Sign In</a></span>
      </div>
    </div>
  </div>
  <div class="nav-wrap"><div class="wrap"><nav class="nav">
      <a href="index.html">Home</a>
      <a href="library.html" class="active">Library</a>
      <a href="builder.html">Builder</a>
      <a href="history.html">History</a>
  </nav></div></div>
</header>

<div class="searchrow no-print"><div class="wrap">
  <input type="text" id="q" placeholder="Search, e.g. Abbotsleigh 2023 or chain rule" autocomplete="off" aria-label="Search papers and questions">
  <a class="btn primary" href="builder.html">Build a paper</a>
</div></div>

<div class="shell" id="gate-main" hidden>
  <aside class="side">
    <button type="button" class="starred" id="starBox" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg> <span>Starred only</span></button>
    <div id="filters"></div>
    <h4>Topics</h4>
    <div id="topics"></div>
    <p style="margin:18px 0 0"><button class="btn" id="reset" style="width:100%">Clear filters</button></p>
  </aside>

  <main class="main">
    <p class="page-sub" id="sub">Loading...</p>
    <div class="tabs">
      <div class="seg" id="view" role="group" aria-label="Library section">
        <button data-v="papers" class="on">Papers</button>
        <button data-v="questions">Questions</button>
      </div>
      <span class="msg" id="shown" aria-live="polite"></span>
    </div>

    <!-- Papers -->
    <section id="papersView">
      <div class="statstrip" id="strip"></div>
      <div class="controls">
        <div class="seg" id="sort" role="group" aria-label="Sort papers">
          <button data-s="school" class="on">By school</button>
          <button data-s="year">By year</button>
        </div>
      </div>
      <div class="idx-head"><span></span><span>№</span><span>School &amp; year</span><span>Questions</span><span>Marks</span><span></span></div>
      <div id="list"></div>
    </section>

    <!-- Questions -->
    <section id="questionsView" hidden>
      <div class="controls">
        <button class="btn" id="shuffle">Shuffle questions</button>
        <button class="btn" id="unshuffle" hidden>Back to paper order</button>
      </div>
      <div id="qlist"></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
</div>

<footer class="site-footer"><div class="wrap">TutorPortal is an independent tool for tutors. Not affiliated with NESA or any school.</div></footer>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/paper-render.js"></script>
<script src="js/render.js"></script>
<script src="js/library.js"></script>
</body>
</html>
